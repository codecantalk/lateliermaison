<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Obsidian / Royal Midnight Blue -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E162B" />
      <stop offset="100%" stop-color="#050914" />
    </linearGradient>

    <!-- Outer Rim: Champagne Gold Accent -->
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.7" />
      <stop offset="40%" stop-color="#F59E0B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.6" />
    </linearGradient>

    <!-- Gold Pillar Gradient: French Luxury Gold -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Ambient Depth Shadow -->
    <filter id="depth" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#F59E0B" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Luxury Squircle Badge Tile -->
  <rect x="10" y="10" width="492" height="492" rx="110" fill="url(#bg)" stroke="url(#rim)" stroke-width="3" />

  <!-- Architectural Monogram Pillars -->
  <g fill="url(#gold)" filter="url(#depth)">
    <!-- Base Foundation Bar -->
    <rect x="134" y="418" width="244" height="36" rx="2" />

    <!-- Left Pillar -->
    <path d="M 134 142 L 196 142 L 196 418 L 176 418 L 176 166 L 154 166 L 154 418 L 134 418 Z" />
    <rect x="144" y="406" width="42" height="12" rx="1" />

    <!-- Center Pillar (Taller) -->
    <path d="M 223 58 L 289 58 L 289 418 L 268 418 L 268 82 L 244 82 L 244 418 L 223 418 Z" />
    <rect x="233" y="406" width="46" height="12" rx="1" />

    <!-- Right Pillar -->
    <path d="M 316 142 L 378 142 L 378 418 L 358 418 L 358 166 L 336 166 L 336 418 L 316 418 Z" />
    <rect x="326" y="406" width="42" height="12" rx="1" />
  </g>
</svg>
